[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
repository = "https://github.com/reza456mokhtari/mediaplayer"

[workspace.dependencies]
mediaplayer-core = { path = "crates/core" }

# glow (OpenGL) instead of eframe's default wgpu renderer: libmpv's render API
# targets OpenGL. See docs/adr/0001-ui-stack-egui-glow.md.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "system_fonts",
    "wayland",
    "x11",
] }
egui_kittest = "0.37"
env_logger = { version = "0.11", default-features = false }
log = "0.4"

[workspace.lints.rust]
# deny (not forbid) so the slice 2 libmpv FFI module can opt in with a scoped allow.
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
# egui/winit/glow are sluggish unoptimized; our own crates stay debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
