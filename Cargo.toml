[workspace]
resolver = "3"
members = ["crates/core", "crates/mpv", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
repository = "https://github.com/reza456mokhtari/mediaplayer"

[workspace.dependencies]
mediaplayer-core = { path = "crates/core" }
mediaplayer-mpv = { path = "crates/mpv" }

# glow (OpenGL) instead of eframe's default wgpu renderer: libmpv's render API
# targets OpenGL. See docs/adr/0001-ui-stack-egui-glow.md.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "system_fonts",
    "wayland",
    "x11",
] }
egui_kittest = "0.37"
env_logger = { version = "0.11", default-features = false }
# Must match the glow version eframe uses: VideoOutput::paint takes eframe's `glow::Context`.
glow = "0.17"
libloading = "0.9"
log = "0.4"
# xdg-portal only: the default `wayland` feature isn't needed, and GTK would need system headers.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[workspace.lints.rust]
# Only crates/mpv (libmpv FFI and OpenGL) opts back in, per module.
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
# egui/winit/glow are sluggish unoptimized; our own crates stay debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
